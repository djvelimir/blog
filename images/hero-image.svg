<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500"
     role="img"
     aria-label="Tech blog banner with stars and aurora">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#07152b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Aurora gradients -->
    <linearGradient id="aurora1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00f5d4" stop-opacity=".42"/>
      <stop offset="65%" stop-color="#7c3aed" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="aurora2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="75%" stop-color="#a855f7" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow -->
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="blur12" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Subtle grid -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50"
            fill="none"
            stroke="#38bdf8"
            stroke-opacity=".055"
            stroke-width="1"/>
    </pattern>

    <!-- Vignette -->
    <radialGradient id="vignette">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".48"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- Atmospheric glow -->
  <ellipse cx="1200" cy="230" rx="500" ry="260"
           fill="url(#glow)"
           filter="url(#blur30)"/>

  <ellipse cx="420" cy="80" rx="360" ry="180"
           fill="#7c3aed"
           opacity=".08"
           filter="url(#blur30)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="85" cy="75" r="1.5" opacity=".85"/>
    <circle cx="150" cy="145" r="1" opacity=".55"/>
    <circle cx="230" cy="62" r="1.8" opacity=".9"/>
    <circle cx="315" cy="112" r="1" opacity=".6"/>
    <circle cx="395" cy="42" r="1.4" opacity=".8"/>
    <circle cx="470" cy="155" r="1.2" opacity=".65"/>
    <circle cx="540" cy="80" r="1.8" opacity=".85"/>
    <circle cx="625" cy="135" r="1" opacity=".55"/>
    <circle cx="710" cy="48" r="1.3" opacity=".75"/>
    <circle cx="790" cy="105" r="1.8" opacity=".9"/>
    <circle cx="865" cy="62" r="1" opacity=".6"/>
    <circle cx="950" cy="145" r="1.5" opacity=".8"/>
    <circle cx="1040" cy="72" r="1.1" opacity=".7"/>
    <circle cx="1125" cy="118" r="1.7" opacity=".85"/>
    <circle cx="1210" cy="55" r="1" opacity=".55"/>
    <circle cx="1290" cy="145" r="1.5" opacity=".75"/>
    <circle cx="1380" cy="82" r="1.8" opacity=".9"/>
    <circle cx="1470" cy="52" r="1" opacity=".65"/>
    <circle cx="1540" cy="130" r="1.4" opacity=".8"/>

    <circle cx="120" cy="250" r="1" opacity=".5"/>
    <circle cx="280" cy="205" r="1.5" opacity=".7"/>
    <circle cx="455" cy="265" r="1" opacity=".55"/>
    <circle cx="610" cy="225" r="1.4" opacity=".7"/>
    <circle cx="770" cy="285" r="1" opacity=".55"/>
    <circle cx="920" cy="215" r="1.5" opacity=".75"/>
    <circle cx="1080" cy="270" r="1" opacity=".6"/>
    <circle cx="1240" cy="220" r="1.4" opacity=".75"/>
    <circle cx="1400" cy="260" r="1" opacity=".55"/>
    <circle cx="1510" cy="205" r="1.5" opacity=".7"/>
  </g>

  <!-- Tiny colored stars -->
  <g fill="#67e8f9">
    <circle cx="180" cy="95" r="1.4"/>
    <circle cx="675" cy="92" r="1.2"/>
    <circle cx="1015" cy="110" r="1.3"/>
    <circle cx="1335" cy="65" r="1.4"/>
  </g>

  <g fill="#c084fc">
    <circle cx="350" cy="180" r="1.2"/>
    <circle cx="850" cy="175" r="1.3"/>
    <circle cx="1450" cy="170" r="1.2"/>
  </g>

  <!-- Aurora ribbons -->
  <path d="
    M -100 390
    C 160 130, 350 110, 570 300
    S 920 500, 1160 245
    S 1430 40, 1700 230
    L 1700 500
    L -100 500 Z"
    fill="url(#aurora1)"
    filter="url(#blur12)"/>

  <path d="
    M -150 430
    C 120 220, 330 200, 550 350
    S 900 470, 1110 210
    S 1400 120, 1750 310"
    fill="none"
    stroke="url(#aurora2)"
    stroke-width="95"
    opacity=".55"
    filter="url(#blur12)"/>

  <path d="
    M -100 350
    C 220 80, 400 160, 610 285
    S 950 430, 1190 180
    S 1450 100, 1700 250"
    fill="none"
    stroke="#22d3ee"
    stroke-width="2"
    opacity=".25"/>

  <path d="
    M -100 370
    C 220 100, 400 180, 620 300
    S 950 445, 1200 195
    S 1450 120, 1700 270"
    fill="none"
    stroke="#a855f7"
    stroke-width="2"
    opacity=".2"/>

  <!-- Tech grid -->
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Horizon glow -->
  <rect x="0" y="420" width="1600" height="80"
        fill="#22d3ee"
        opacity=".025"/>

  <!-- Minimal circuit decorations -->
  <g fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1">
    <path d="M80 410 H180 V380 H250"/>
    <path d="M1320 395 H1410 V360 H1515"/>
    <path d="M1280 450 H1360 V420 H1450"/>
  </g>

  <g fill="#38bdf8" opacity=".5">
    <circle cx="180" cy="410" r="3"/>
    <circle cx="250" cy="380" r="3"/>
    <circle cx="1410" cy="360" r="3"/>
    <circle cx="1515" cy="360" r="3"/>
    <circle cx="1360" cy="450" r="3"/>
  </g>

  <!-- Vignette -->
  <rect width="1600" height="500" fill="url(#vignette)"/>

</svg>
